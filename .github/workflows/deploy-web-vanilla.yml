name: Deploy Web Vanilla to GitHub Pages

on:
  workflow_dispatch:


jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build assets
        run: pnpm build

      - name: Setup Pages
        run: |
          # Read version from packages/reactive/package.json
          VERSION=$(node -p "require('./packages/reactive/package.json').version")
          echo "VERSION=$VERSION"

          # Copy dist/timeless/{version}/ -> apps/web-vanilla/public/timeless/{version}/
          mkdir -p apps/web-vanilla/public/timeless/$VERSION
          cp dist/timeless/$VERSION/* apps/web-vanilla/public/timeless/$VERSION/

          # Add 404.html for SPA routing
          cp apps/web-vanilla/index.html apps/web-vanilla/404.html

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apps/web-vanilla
          publish_branch: docs
