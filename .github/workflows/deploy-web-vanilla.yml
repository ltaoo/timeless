name: Deploy Web Vanilla to GitHub Pages

on:
  workflow_dispatch:


jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build assets
        run: node scripts/dev.js --build

      - name: Setup Pages
        run: |
          mkdir -p dist
          cp apps/web-vanilla/index.html dist/
          cp apps/web-vanilla/index.html dist/404.html
          cp -r apps/web-vanilla/public dist/
          cp -r apps/web-vanilla/src dist/

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: docs
