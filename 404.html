  <title>TheBox</title>
  <style>
    :root {
      --background: #ededed;
      --foreground: #171717;
      --BG-0: #ffffff;
      --BG-1: #f7f7f7;
      --BG-2: #fff;
      --BG-3: #f7f7f7;
      --BG-4: #4c4c4c;
      --BG-5: #fff;
      --FG-0: rgba(0, 0, 0, 0.9);
      --FG-0_5: rgba(0, 0, 0, 0.9);
      --FG-1: rgba(0, 0, 0, 0.55);
      --FG-2: rgba(0, 0, 0, 0.3);
      --FG-3: rgba(0, 0, 0, 0.1);
      --FG-4: rgba(0, 0, 0, 0.15);
      --FG-5: rgba(0, 0, 0, 0.05);
      --BG-COLOR-ACTIVE: #ececec;
      --RED: #fa5151;
      --GREEN: #07c160;
      --border: oklch(92.2% 0 0);
      --hh: 100vh;
    }

    [data-theme="dark"] {
      --background: #111;
      --foreground: #f3f4f6;
      --BG-0: #111;
      --BG-1: #1e1e1e;
      --BG-2: #191919;
      --BG-3: #202020;
      --BG-4: #404040;
      --BG-5: #2c2c2c;
      --FG-0: rgba(255, 255, 255, 0.8);
      --FG-0_5: rgba(255, 255, 255, 0.6);
      --FG-1: rgba(255, 255, 255, 0.5);
      --FG-2: rgba(255, 255, 255, 0.3);
      --FG-3: rgba(255, 255, 255, 0.1);
      --FG-4: rgba(255, 255, 255, 0.15);
      --FG-5: rgba(255, 255, 255, 0.1);
      --BG-COLOR-ACTIVE: #373737;
      --RED: #fa5151;
      --GREEN: #07c160;
      --border: oklch(100% 0 0/.1);
    }

    #root {
      width: 100vw;
      height: 100vh;
    }

    @keyframes enter {
      from {
        opacity: var(--tw-enter-opacity, 1);
        transform: translate3d(var(--tw-enter-translate-x, 0), var(--tw-enter-translate-y, 0), 0) scale3d(var(--tw-enter-scale, 1), var(--tw-enter-scale, 1), var(--tw-enter-scale, 1));
      }
    }

    @keyframes exit {
      to {
        opacity: var(--tw-exit-opacity, 1);
        transform: translate3d(var(--tw-exit-translate-x, 0), var(--tw-exit-translate-y, 0), 0) scale3d(var(--tw-exit-scale, 1), var(--tw-exit-scale, 1), var(--tw-exit-scale, 1));
      }
    }

    .animate-in {
      animation: enter 150ms ease-out;
    }

    .animate-out {
      animation: exit 150ms ease-in forwards;
    }

    .fade-in {
      --tw-enter-opacity: 0;
    }

    .fade-in-0 {
      --tw-enter-opacity: 0;
    }

    .fade-out {
      --tw-exit-opacity: 0;
    }

    .fade-out-0 {
      --tw-exit-opacity: 0;
    }

    .zoom-in-95 {
      --tw-enter-scale: 0.95;
    }

    .zoom-out-95 {
      --tw-exit-scale: 0.95;
    }

    .slide-in-from-top-full {
      --tw-enter-translate-y: -100%;
    }

    .slide-in-from-bottom-2 {
      --tw-enter-translate-y: 0.5rem;
    }

    .slide-out-to-bottom {
      --tw-exit-translate-y: 100%;
    }

    .slide-out-to-bottom-2 {
      --tw-exit-translate-y: 0.5rem;
    }
  </style>
</head>

<body>
  <script>!function () { try { var d = document.documentElement, n = 'data-theme', s = 'setAttribute'; var e = localStorage.getItem('theme'); if ('system' === e || (!e && true)) { var t = '(prefers-color-scheme: dark)', m = window.matchMedia(t); if (m.media !== t || m.matches) { d.style.colorScheme = 'dark'; d[s](n, 'dark') } else { d.style.colorScheme = 'light'; d[s](n, 'light') } } else if (e) { d[s](n, e || '') } if (e === 'light' || e === 'dark') d.style.colorScheme = e } catch (e) { } }()</script>
  <script src="public/tailwindcss.3.4.17.js"></script>
  <script>
    tailwind.config = {
      darkMode: ['selector', '[data-theme="dark"]'],
    }
  </script>
  <script src="public/timeless.core.umd.min.js"></script>
  <script src="public/timeless.web.umd.min.js"></script>
  <script src="public/reactive.umd.min.js"></script>
  <script src="public/headless.umd.min.js"></script>
  <script src="public/shadcnui.umd.min.js"></script>
  <div id="root"></div>
  <script type="module" src="src/index.js"></script>
</body>

</html>
