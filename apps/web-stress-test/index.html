<!doctype html>
<html lang="en" style="height: 100%">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timeless vanilla js example</title>
  <script>
    !(function () {
      try {
        var d = document.documentElement;
        var e = localStorage.getItem("theme");
        var resolved;
        if ("system" === e || !e) {
          var t = "(prefers-color-scheme: dark)",
            m = window.matchMedia(t);
          resolved = m.media !== t || m.matches ? "dark" : "light";
        } else {
          resolved = e;
        }
        d.style.colorScheme = resolved;
        if (resolved === "dark") {
          d.classList.add("dark");
        } else {
          d.classList.remove("dark");
        }
      } catch (e) { }
    })();
  </script>
  <script src="./public/timeless/0.23.0/timeless.umd.min.js"></script>
  <script src="./public/timeless/0.23.0/timeless.dom.umd.min.js"></script>
  <script>
    Object.assign(window, Timeless);
  </script>
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }

    #root {
      height: 100%;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script src="./src/index.js"></script>
</body>

</html>
