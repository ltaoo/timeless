<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test For Component Duplicate</title>
  <style>
    :root {
      --background: #ededed;
      --foreground: #171717;
      --BG-0: #ffffff;
      --BG-1: #f7f7f7;
      --BG-2: #fff;
      --BG-3: #f7f7f7;
      --BG-4: #4c4c4c;
      --BG-5: #fff;
      --FG-0: rgba(0, 0, 0, 0.9);
      --FG-0_5: rgba(0, 0, 0, 0.9);
      --FG-1: rgba(0, 0, 0, 0.55);
      --FG-2: rgba(0, 0, 0, 0.3);
      --FG-3: rgba(0, 0, 0, 0.1);
      --FG-4: rgba(0, 0, 0, 0.15);
      --FG-5: rgba(0, 0, 0, 0.05);
      --BG-COLOR-ACTIVE: #ececec;
      --RED: #fa5151;
      --GREEN: #07c160;
      --border: oklch(92.2% 0 0);
      --hh: 100vh;
    }

    [data-theme="dark"] {
      --background: #111;
      --foreground: #f3f4f6;
      --BG-0: #111;
      --BG-1: #1e1e1e;
      --BG-2: #191919;
      --BG-3: #202020;
      --BG-4: #404040;
      --BG-5: #2c2c2c;
      --FG-0: rgba(255, 255, 255, 0.8);
      --FG-0_5: rgba(255, 255, 255, 0.6);
      --FG-1: rgba(255, 255, 255, 0.5);
      --FG-2: rgba(255, 255, 255, 0.3);
      --FG-3: rgba(255, 255, 255, 0.1);
      --FG-4: rgba(255, 255, 255, 0.15);
      --FG-5: rgba(255, 255, 255, 0.1);
      --BG-COLOR-ACTIVE: #373737;
      --RED: #fa5151;
      --GREEN: #07c160;
      --border: oklch(100% 0 0/.1);
    }

    body {
      font-family: sans-serif;
      padding: 20px;
    }

    .menu-item {
      padding: 8px;
      margin: 4px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .item-simple {
      background: #e3f2fd;
    }

    .item-complex {
      background: #fff3e0;
    }

    button {
      padding: 8px 16px;
      margin: 10px 0;
      cursor: pointer;
    }

    @keyframes enter {
      from {
        opacity: var(--tw-enter-opacity, 1);
        transform: translate3d(var(--tw-enter-translate-x, 0), var(--tw-enter-translate-y, 0), 0) scale3d(var(--tw-enter-scale, 1), var(--tw-enter-scale, 1), var(--tw-enter-scale, 1));
      }
    }

    @keyframes exit {
      to {
        opacity: var(--tw-exit-opacity, 1);
        transform: translate3d(var(--tw-exit-translate-x, 0), var(--tw-exit-translate-y, 0), 0) scale3d(var(--tw-exit-scale, 1), var(--tw-exit-scale, 1), var(--tw-exit-scale, 1));
      }
    }

    .animate-in {
      animation: enter 150ms ease-out;
    }

    .animate-out {
      animation: exit 150ms ease-in forwards;
    }

    .fade-in-0 {
      --tw-enter-opacity: 0;
    }

    .fade-out-0 {
      --tw-exit-opacity: 0;
    }

    .zoom-in-95 {
      --tw-enter-scale: 0.95;
    }

    .zoom-out-95 {
      --tw-exit-scale: 0.95;
    }

    .slide-in-from-top {
      --tw-enter-translate-y: -20px;
    }

    .slide-out-to-top {
      --tw-exit-translate-y: -20px;
    }
  </style>
</head>

<body>
  <script>!function () { try { var d = document.documentElement, n = 'data-theme', s = 'setAttribute'; var e = localStorage.getItem('theme'); if ('system' === e || (!e && true)) { var t = '(prefers-color-scheme: dark)', m = window.matchMedia(t); if (m.media !== t || m.matches) { d.style.colorScheme = 'dark'; d[s](n, 'dark') } else { d.style.colorScheme = 'light'; d[s](n, 'light') } } else if (e) { d[s](n, e || '') } if (e === 'light' || e === 'dark') d.style.colorScheme = e } catch (e) { } }()</script>
  <script src="../../packages/vanillalite/dist/timeless.vanillalite.umd.min.js"></script>
  <div id="container"></div>
  <script>
    const { ref, refobj, computed, For, Show, View, Fragment, Portal, render } = Timeless;

    function MenuItem(props) {
      const visible_ = ref(false);

      return View({}, [
        props.label,
        Show({ when: computed(props, (t) => t.type !== "simple"), }, [
          View({
            class: 'menu-btn',
            onClick() {
              visible_.as((prev) => !prev);
            },
          }, ["Click it"]),
          Portal({
            onUnmounted() {
              console.log('[]the sub menu portal is unmounted');
            },
          }, [
            Show({
              when: visible_,
              onUnmounted() {
                console.log('the sub menu show is unmounted');
              }
            }, [
              View({
                class: "",
                style: { "position": "fixed", left: "120px", top: "120px" },
                onUnmounted() {
                  console.log('hello wrap is unmounted');
                }
              }, [
                View({
                  onUnmounted() {
                    console.log('hello is unmounted');
                  }
                }, ["Hello"])
              ]),
            ]),
          ])
        ])
      ]);
    }

    function AppView() {
      const state_ = refobj({
        mounted: false,
        enter: false,
        exit: false,
      });

      return View({}, [
        View({
          onClick() {
            if (state_.value.mounted) {
              state_.as({
                ...state_.value,
                exit: true,
                enter: false,
              });
              setTimeout(() => {
                state_.as({
                  ...state_.value,
                  exit: false,
                  mounted: false,
                });
              }, 150);
              return
            }
            state_.as({
              ...state_.value,
              mounted: true,
              enter: true,
            });
            setTimeout(() => {
              state_.as({
                ...state_.value,
                enter: false,
              });
            }, 150);
          },
        }, ["Click it"]),
        Show({ when: computed(state_, (t) => t.mounted) }, [
          View({
            class: computed(state_, (t) => {
              const classes = [];
              if (t.enter) classes.push('animate-in', 'fade-in-0', 'slide-in-from-top');
              if (t.exit) classes.push('animate-out', 'fade-out-0', 'slide-out-to-top');
              return classes.join(' ');
            }),
            style: 'width: 120px; height: 120px; background: #e3f2fd; border: 1px solid #2196f3;'
          })
        ]),
      ]);

    }

    const container = document.getElementById('container');
    render(AppView(), container)
  </script>
</body>

</html>
