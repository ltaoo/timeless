  <h1>Test For Component - Duplicate Issue</h1>
  <button id="toggle">Toggle List</button>
  <div id="container"></div>

  <script src="../../packages/vanillalite/dist/timeless.vanillalite.umd.min.js"></script>

  <script>
    const { ref, refobj, computed, For, Show, View, Fragment, Portal, render } = Timeless;

    function MenuItem(props) {
      const visible_ = ref(false);

      return View({}, [
        props.label,
        Show({ when: computed(props, (t) => t.type !== "simple"), }, [
          View({
            class: 'menu-btn',
            onClick() {
              visible_.as((prev) => !prev);
            },
          }, ["Click it"]),
          Portal({
            onUnmounted() {
              console.log('[]the sub menu portal is unmounted');
            },
          }, [
            Show({
              when: visible_,
              onUnmounted() {
                console.log('the sub menu show is unmounted');
              }
            }, [
              View({
                class: "",
                style: "position: fixed; left: 120px; top: 120px;",
                onUnmounted() {
                  console.log('hello wrap is unmounted');
                }
              }, [
                View({
                  onUnmounted() {
                    console.log('hello is unmounted');
                  }
                }, ["Hello"])
              ]),
            ]),
          ])
        ])
      ]);
    }

    function AppView() {
      const items = ref([
        { id: 1, label: 'Item 1', type: 'simple' },
        { id: 2, label: 'Item 2', type: 'complex' },
        { id: 3, label: 'Item 3', type: 'simple' },
      ]);
      const open_ = ref(false);

      document.getElementById('toggle').addEventListener('click', () => {
        if (open_.value) {
          open_.as(false);
        } else {
          open_.as(true);
        }
      });

      return Portal({
        onUnmounted() {
          console.log('root portal is Unmounted');
        },
      }, [
        Show({ when: open_, }, [View({
          class: 'menu',
          onUnmounted() {
            console.log('[page]menu view unmounted');
          },
        }, [
          MenuItem({ id: 1, label: "item", type: "complex" }),
          // For({
          //   each: items,

          //     return MenuItem(item);
          //   },
          //   onUnmounted() {
          //     console.log('[]menu items unmounted');
          //   }
          // })
        ]),
        ]
        )
      ]);
    }

    const container = document.getElementById('container');
    render(AppView(), container)
