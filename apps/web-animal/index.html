<!DOCTYPE html>
<html lang="zh-CN" data-tt-style="animal">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timeless · Animal Island</title>
  <base href="/" />
  <script type="importmap">
    {
      "imports": {
        "@/": "./src/"
      }
    }
  </script>
  <link href="public/timeless/0.33.1/timeless.animal.css" rel="stylesheet" />
  <!--
    animal 是**只做亮色**的作用域库：上游 animal-island-ui 的 variables.less 与
    themes/default.less 都只有一套亮色 token，没有暗色块。所以这里不再跑
    「读 localStorage → 设 data-theme / .dark」的那段引导脚本，<html> 上的
    data-theme 与 .dark 永远不出现，本库的组件也就始终是亮色。
    页面上的暗色开关按钮刻意保留但置为 disabled，理由写在按钮与设计规范页里 ——
    直接删掉会让人误以为「漏做了」。
  -->
  <script src="public/timeless/0.33.1/timeless.umd.min.js"></script>
  <script src="public/timeless/0.33.1/timeless.dom.umd.min.js"></script>
  <script src="public/timeless/0.33.1/timeless.animal.umd.min.js"></script>
  <script src="public/timeless/0.33.1/timeless.web.umd.min.js"></script>
  <script src="public/timeless/0.33.1/timeless.utils.umd.min.js"></script>
  <script>
    // Animal Island 与 bootstrap / shadcn 组件同名，只把 animal 的导出挂到 window，
    // 不合并其它样式库的导出，避免覆盖 —— 靠 data-tt-style 作用域隔离。
    Object.assign(window, Timeless);
    Object.assign(window, Timeless.animal);
  </script>
  <!--
    画廊排版样式。刻意只用 Timeless 语义别名 token（--foreground / --muted-foreground /
    --border / --font-size 等），不写死颜色，因此主题切换无需额外处理。
    这些类名（gallery-*）不属于组件库，是示例应用私有样式。
  -->
  <style>
    body {
      margin: 0;
      background: var(--background);
      color: var(--foreground);
      font-family: var(--font-sans, system-ui, sans-serif);
      font-size: var(--font-size, 14px);
      -webkit-font-smoothing: antialiased;
    }
    /* height:100%（不是 100vh）—— 分类页现在是 keep-alive 盒子里的子页，外层
       .route-view 已经 height:100% + overflow:auto，写 100vh 会双重滚动。 */
    .gallery-root { height: 100%; overflow-y: auto; }
    .gallery-page { max-width: 960px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
    .gallery-header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 1rem; padding-bottom: 1.5rem; margin-bottom: 2rem;
      border-bottom: 1px solid var(--border);
    }
    .gallery-title { font-size: 1.5rem; font-weight: 600; }
    .gallery-subtitle { font-size: 0.875rem; color: var(--muted-foreground); margin-top: 0.25rem; }
    .gallery-section { margin-bottom: 2.5rem; }
    .gallery-section-title {
      font-size: 0.75rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--muted-foreground);
      margin-bottom: 0.75rem;
    }
    .gallery-section-body { display: flex; flex-direction: column; gap: 1.5rem; }
    .gallery-item-label { font-size: 0.8125rem; color: var(--muted-foreground); margin-bottom: 0.5rem; }
    .gallery-item-body { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; }
    .gallery-field { width: 260px; }
    .gallery-field-wide { width: 100%; max-width: 460px; }
    .gallery-stack { display: flex; flex-direction: column; gap: 0.75rem; width: 100%; max-width: 520px; }
    .gallery-row { display: flex; align-items: center; gap: 0.75rem; }
    .gallery-card-wrap { width: 100%; max-width: 380px; }
    .gallery-ratio-wrap { width: 260px; }
    .gallery-ratio-fill {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: var(--muted); border: 1px solid var(--border); border-radius: var(--radius);
      font-size: 0.875rem; color: var(--muted-foreground);
    }
    .gallery-scroll-area { height: 160px; width: 260px; border: 1px solid var(--border); border-radius: var(--radius); padding: 0.5rem; }
    .gallery-scroll-row { padding: 0.375rem 0.25rem; font-size: 0.875rem; }
    .gallery-skeleton-demo { display: flex; align-items: center; gap: 0.75rem; }
    .gallery-skeleton-lines { display: flex; flex-direction: column; gap: 0.5rem; }
    .gallery-skeleton-demo .skeleton-avatar { width: 40px; height: 40px; border-radius: 50%; }
    .gallery-skeleton-demo .skeleton-line { width: 200px; height: 12px; }
    .gallery-skeleton-demo .skeleton-line-short { width: 140px; }
    /* --- Tier 2 画廊辅助 --- */
    .gallery-wide { width: 100%; max-width: 540px; }
    .gallery-ctx-target {
      display: flex; align-items: center; justify-content: center;
      width: 300px; height: 140px; user-select: none;
      border: 1px dashed var(--border); border-radius: var(--radius);
      color: var(--muted-foreground); font-size: 0.875rem;
    }
    .gallery-toast-wrap { width: 100%; max-width: 380px; }
    .animal-toast__header .gallery-toast-time {
      margin-left: auto; font-size: 0.75rem; font-weight: 400;
      color: var(--muted-foreground);
    }
    .gallery-resizable {
      width: 100%; max-width: 540px; height: 220px; overflow: hidden;
      border: 1px solid var(--border-subtle); border-radius: var(--radius);
    }
    .gallery-pane {
      display: flex; align-items: center; justify-content: center;
      height: 100%; font-size: 0.875rem; color: var(--muted-foreground);
      background: var(--surface-1);
    }
    /* --- Tier 3 画廊辅助 --- */
    .gallery-scroll-view-box {
      height: 220px; overflow: hidden;
      border: 1px solid var(--border-subtle); border-radius: var(--radius);
    }
    .gallery-scroll-view-box > .animal-scroll-view { height: 100%; }
    .gallery-affix-bar {
      display: inline-flex; align-items: center;
      width: max-content; height: 36px; padding: 0 14px;
      font-size: 0.875rem; font-weight: 500;
    }
    .gallery-filler-row {
      padding: 0.5rem 0.25rem; font-size: 0.875rem;
      color: var(--muted-foreground);
      border-bottom: 1px solid var(--border-subtle);
    }
    .gallery-waterfall-box {
      width: 100%; max-width: 540px; height: 320px; overflow: hidden;
      border: 1px solid var(--border-subtle); border-radius: var(--radius);
    }
    .gallery-waterfall-card {
      display: flex; flex-direction: column; justify-content: space-between;
      height: calc(100% - 12px); padding: 0.75rem; box-sizing: border-box;
      background: var(--surface-1);
      border: 1px solid var(--border-subtle); border-radius: var(--radius);
    }
    .gallery-waterfall-card-title {
      font-size: 0.875rem; font-weight: 600; color: var(--foreground);
      word-break: break-all;
    }
    .gallery-waterfall-card-meta {
      font-size: 0.75rem; color: var(--muted-foreground);
    }
    /* --- 左侧两级菜单（分类 → 组件）--- */
    .gallery-shell { height: 100vh; overflow: hidden; }
    .gallery-menu {
      display: flex; flex-direction: column; height: 100%;
      padding: 1rem 0.625rem; overflow: hidden;
      border-right: 1px solid var(--border); background: var(--card);
    }
    .gallery-menu-title {
      font-size: 0.75rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--muted-foreground);
      padding: 0 0.5rem; margin-bottom: 0.5rem;
    }
    .gallery-menu-scroll { flex: 1; min-height: 0; overflow-y: auto; }
    .gallery-menu-group { margin-bottom: 0.75rem; }
    .gallery-menu-group-title {
      display: block; width: 100%; text-align: left; background: transparent; border: 0;
      padding: 0.25rem 0.5rem; font-size: 0.6875rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--muted-foreground); cursor: pointer;
      border-radius: calc(var(--radius) - 2px);
    }
    .gallery-menu-group-title:hover { color: var(--foreground); background: var(--muted); }
    .gallery-menu-group-title.is-active { color: var(--foreground); background: var(--muted); }
    .gallery-menu-item {
      display: block; width: 100%; text-align: left; background: transparent; border: 0;
      margin: 0.0625rem 0 0 0.5rem; padding: 0.25rem 0.5rem;
      font-size: 0.8125rem; line-height: 1.5; cursor: pointer;
      border-radius: calc(var(--radius) - 2px);
      color: var(--muted-foreground);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .gallery-menu-item:hover { background: var(--muted); color: var(--foreground); }
    .gallery-menu-item.is-active {
      background: var(--primary); color: var(--primary-foreground); font-weight: 500;
    }
    .gallery-menu-footer {
      display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;
      padding-top: 0.75rem; margin-top: 0.5rem; border-top: 1px solid var(--border);
    }
    /* 锚点命中后闪一下 */
    [data-section].is-flash { outline: 3px solid var(--primary); outline-offset: 3px; }

    /* --- 页面切换 --- */
    .gallery-header-actions { display: flex; align-items: center; gap: 0.75rem; }
    .gallery-nav {
      display: flex; align-items: center; gap: 0.125rem; padding: 0.1875rem;
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--card);
    }
    .gallery-nav-link {
      padding: 0.25rem 0.75rem; font-size: 0.8125rem; line-height: 1.5;
      border-radius: calc(var(--radius) - 2px); cursor: pointer;
      color: var(--muted-foreground); white-space: nowrap;
    }
    .gallery-nav-link:hover { background: var(--muted); color: var(--foreground); }
    .gallery-nav-link.is-active { background: var(--primary); color: var(--primary-foreground); }

    /* --- 设计规范：外壳 --- */
    .gallery-page-wide { max-width: 1240px; }
    .gallery-spec {
      display: grid; grid-template-columns: 320px minmax(0, 1fr);
      gap: 1.5rem; align-items: start;
    }
    @media (max-width: 960px) { .gallery-spec { grid-template-columns: 1fr; } }
    .gallery-spec-panel {
      position: sticky; top: 1rem; max-height: calc(100vh - 2rem); overflow-y: auto;
      padding: 1rem; border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--card); color: var(--card-foreground);
    }
    .gallery-spec-panel-title {
      font-size: 0.75rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--muted-foreground);
    }
    .gallery-spec-panel-note { margin-top: 0.5rem; font-size: 0.75rem; color: var(--muted-foreground); }
    .gallery-spec-group { margin-top: 1.125rem; }
    .gallery-spec-group-title { font-size: 0.8125rem; font-weight: 600; margin-bottom: 0.5rem; }
    .gallery-spec-group-empty { font-size: 0.75rem; color: var(--muted-foreground); }
    .gallery-spec-knob { margin-bottom: 0.875rem; }
    .gallery-spec-knob-head { display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem; }
    .gallery-spec-knob-label { font-size: 0.8125rem; }
    .gallery-spec-knob-name { font-family: var(--font-mono); font-size: 0.6875rem; color: var(--muted-foreground); }
    .gallery-spec-knob-body { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.125rem; }
    .gallery-spec-knob-value {
      font-family: var(--font-mono); font-size: 0.6875rem; color: var(--muted-foreground);
      min-width: 4.5rem; text-align: right; word-break: break-all;
    }
    .gallery-spec-slider { flex: 1; min-width: 0; }
    .gallery-spec-color {
      width: 44px; height: 30px; padding: 0; border: 1px solid var(--border);
      border-radius: calc(var(--radius) - 2px); background: var(--background); cursor: pointer;
    }
    .gallery-spec-text-input {
      flex: 1; min-width: 0; font-family: var(--font-mono); font-size: 0.75rem;
      padding: 0.25rem 0.5rem; border: 1px solid var(--border);
      border-radius: calc(var(--radius) - 2px); background: var(--background); color: var(--foreground);
    }
    .gallery-spec-actions {
      display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1.25rem;
      padding-top: 1rem; border-top: 1px solid var(--border);
    }

    /* --- 设计规范：预览孤岛 --- */
    .gallery-spec-canvas {
      padding: 1.5rem; border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--background); color: var(--foreground);
    }
    .gallery-spec-canvas.is-fullscreen {
      position: fixed; inset: 0; z-index: 60; overflow-y: auto;
      border: 0; border-radius: 0;
    }
    .gallery-spec-preview {
      display: flex; flex-direction: column; gap: 1rem;
      padding-bottom: 1.5rem; border-bottom: 1px solid var(--border);
    }
    .gallery-spec-preview-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; }
    .gallery-spec-preview-field { width: 220px; }
    .gallery-spec-preview-progress { width: 160px; }
    .gallery-spec-preview-card { width: 280px; }
    .gallery-spec-preview-stack { display: flex; flex-direction: column; gap: 0.5rem; flex: 1; min-width: 240px; }

    /* --- 设计规范：只读规范表 --- */
    .gallery-spec-tables { display: flex; flex-direction: column; gap: 1.5rem; margin-top: 1.5rem; }
    .gallery-spec-tables .gallery-section { margin-bottom: 0; }
    .gallery-spec-hint { font-size: 0.75rem; color: var(--muted-foreground); margin-bottom: 0.5rem; }
    .gallery-spec-notice {
      font-size: 0.8125rem; color: var(--muted-foreground);
      padding: 0.75rem; border: 1px dashed var(--border); border-radius: var(--radius);
    }
    .gallery-spec-table { display: flex; flex-direction: column; }
    .gallery-spec-tr {
      display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1.5fr) minmax(0, 1fr) minmax(0, 1fr) 64px;
      gap: 0.75rem; align-items: center; padding: 0.375rem 0;
      border-bottom: 1px solid var(--border); font-size: 0.8125rem;
    }
    .gallery-spec-tr.is-head {
      font-size: 0.6875rem; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--muted-foreground); border-bottom-width: 2px;
    }
    .gallery-spec-token { font-family: var(--font-mono); font-size: 0.75rem; }
    .gallery-spec-token-label { font-size: 0.6875rem; color: var(--muted-foreground); }
    .gallery-spec-code, .gallery-spec-value {
      font-family: var(--font-mono); font-size: 0.6875rem;
      color: var(--muted-foreground); word-break: break-all;
    }
    .gallery-spec-value { color: var(--foreground); }
    .gallery-spec-cell-specimen { display: flex; align-items: center; }
    .gallery-spec-swatch {
      width: 28px; height: 28px; border-radius: calc(var(--radius) - 2px);
      border: 1px solid var(--border);
    }
    .gallery-spec-radius { width: 56px; height: 28px; background: var(--muted); border: 1px solid var(--border); }
    .gallery-spec-bar { height: 12px; max-width: 100%; background: var(--primary); border-radius: 2px; }
    .gallery-spec-height { width: 56px; background: var(--muted); border: 1px solid var(--border); }
    .gallery-spec-type { line-height: 1; }
    .gallery-spec-shadow {
      width: 56px; height: 28px; border-radius: calc(var(--radius) - 2px); background: var(--card);
    }
    .gallery-spec-motion {
      display: flex; align-items: center; justify-content: center;
      width: 56px; height: 28px; font-size: 0.625rem;
      border-radius: calc(var(--radius) - 2px); background: var(--muted);
      color: var(--muted-foreground);
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="src/index.js"></script>
</body>

</html>
